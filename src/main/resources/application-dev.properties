server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/beladent_db
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${JWT_SECRET:change-me-before-use-minimum-32-characters}
app.jwt.expiration=86400000

app.upload.dir=uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000


app.upload.max-size=5242880
app.upload.allowed-types=image/jpeg,image/png,image/webp
