server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

app.upload.dir=${UPLOAD_DIR:/var/data/uploads}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.upload.max-size=${UPLOAD_MAX_SIZE:5242880}
app.upload.allowed-types=${UPLOAD_ALLOWED_TYPES:image/jpeg,image/png,image/webp}

app.admin.username=${ADMIN_USERNAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
